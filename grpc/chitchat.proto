syntax = "proto3";

package chitchat;

option go_package = "chitchat/grpc;chitchat";

service ChitChat {
  rpc Join(JoinRequest) returns (stream Broadcast);
  rpc Publish(PublishRequest) returns (PublishResponse);
  rpc Leave(LeaveRequest) returns (LeaveResponse);
}

message Broadcast  {
  string content = 1;
  int64 lamportTime = 2;
}

message JoinRequest {
  string username = 1;
}

message PublishRequest {
  string username = 1;
  string content = 2;
  int64 lamportTime = 3;
}

message PublishResponse {
  int64 lamportTime = 1;
}

message LeaveRequest {
  string username = 1;
  int64 lamportTime = 2;
}

message LeaveResponse {
  int64 lamportTime = 1;
}